---
- name: Cluster Master Host Base Provisioning
  hosts: localhost
  become: yes
  vars:
    # PDK defaults (override via extra-vars)
    platform_slug: "{{ platform_slug | default('wapps') }}"
    base_domain: "{{ base_domain | default('wapps.ai') }}"

    apps_dir: "/opt/{{ platform_slug }}"
    # Default TLS certificate paths used by host nginx vhosts (override if needed)
    nginx_ssl_certificate_path: "/etc/ssl/{{ platform_slug }}/fullchain.pem"
    nginx_ssl_certificate_key_path: "/etc/ssl/{{ platform_slug }}/private/privkey.pem"
    # When true, we will include *.api.<env>.<domain> in certificate SANs
    enable_api_gateway_domain: "{{ enable_api_gateway_domain | default(wapps_enable_api_gateway_domain | default(true)) }}"

  tasks:
    - name: Normalize host provisioning environment
      set_fact:
        pdk_target_env: "{{ target_env | default('staging') }}"

    - name: Set target environment default
      set_fact:
        target_env: "{{ pdk_target_env }}"

    - name: Set DNS labels for public hostnames
      set_fact:
        dns_env_label: "{{ dns_env_label | default(pdk_target_env) }}"

    - name: Track explicit public domain suffix
      set_fact:
        pdk_public_domain_suffix_explicit: "{{ (public_domain_suffix | default('') | string | length) > 0 }}"

    - name: Set public domain suffix
      set_fact:
        public_domain_suffix: "{{ public_domain_suffix | default(dns_env_label ~ '.' ~ base_domain) }}"

    - name: Normalize host provisioning phases
      set_fact:
        pdk_install_system: "{{ install_system | default(true) | bool }}"
        pdk_install_k3s: "{{ install_k3s | default(true) | bool }}"
        pdk_install_ingress_controller: "{{ install_ingress_controller | default(install_k3s | default(true)) | bool }}"
        pdk_install_tailscale: "{{ install_tailscale | default(true) | bool }}"
        pdk_install_host_certificates: "{{ install_host_certificates | default(true) | bool }}"
        pdk_install_host_nginx: "{{ install_host_nginx | default(true) | bool }}"
        pdk_install_host_dns: "{{ install_host_dns | default(true) | bool }}"

    - name: Display provisioning start
      debug:
        msg: |
          Starting PDK host provisioning...
          Environment: {{ pdk_target_env }}
          Public domain suffix: {{ public_domain_suffix }}
          Target directory: {{ apps_dir }}
          Boundary: PDK installs reusable host runtime, K3s, and front-door plumbing. Cluster bootstrap, applications, host data stores, and observability add-ons are outside this playbook.
          Phases:
            - System baseline: {{ 'enabled' if pdk_install_system | bool else 'disabled' }}
            - K3s server: {{ 'enabled' if pdk_install_k3s | bool else 'disabled' }}
            - ingress-nginx front-door: {{ 'enabled' if pdk_install_ingress_controller | bool else 'disabled' }}
            - Tailscale: {{ 'enabled' if pdk_install_tailscale | bool else 'disabled' }}
            - Host TLS certificates: {{ 'enabled' if pdk_install_host_certificates | bool else 'disabled' }}
            - Host nginx: {{ 'enabled' if pdk_install_host_nginx | bool else 'disabled' }}
            - Host DNS helper: {{ 'enabled' if pdk_install_host_dns | bool else 'disabled' }}

    - name: Include system configuration
      include_tasks: system/configure.yml
      when: pdk_install_system | bool

    - name: Include K3s server installation
      include_tasks: k3s/install.yml
      when: pdk_install_k3s | bool

    - name: Include ingress-nginx front-door installation
      include_tasks: ingress/install.yml
      when: pdk_install_ingress_controller | bool

    - name: Include Tailscale installation
      include_tasks: tailscale/install.yml
      when: pdk_install_tailscale | bool

    - name: Include TLS certificate provisioning
      include_tasks: certificates/install.yml
      when: pdk_install_host_certificates | bool

    - name: Include Nginx reverse proxy installation
      include_tasks: nginx/install.yml
      when: pdk_install_host_nginx | bool

    - name: Include DNS installation
      include_tasks: dns/install.yml
      vars:
        target_ip: "{{ (tailscale_ip.stdout | default('') | trim) if ((tailscale_ip.stdout | default('') | trim) | length > 0) else ansible_default_ipv4.address }}"
      when: pdk_install_host_dns | bool

    - name: Display provisioning summary
      debug:
        msg: |
          PDK host provisioning completed.
          Environment: {{ pdk_target_env }}
          Public domain suffix: {{ public_domain_suffix }}
          Applications directory: {{ apps_dir }}
          Completed phase selection:
            - OS baseline and firewall: {{ 'enabled' if pdk_install_system | bool else 'disabled' }}
            - K3s server: {{ 'enabled' if pdk_install_k3s | bool else 'disabled' }}
            - ingress-nginx front-door: {{ 'enabled' if pdk_install_ingress_controller | bool else 'disabled' }}
            - Tailscale: {{ 'enabled' if pdk_install_tailscale | bool else 'disabled' }}
            - Host TLS certificates: {{ 'enabled' if pdk_install_host_certificates | bool else 'disabled' }}
            - Host nginx reverse proxy: {{ 'enabled' if pdk_install_host_nginx | bool else 'disabled' }}
            - dnsmasq DNS helper: {{ 'enabled' if pdk_install_host_dns | bool else 'disabled' }}
          Outside this host entrypoint:
            - Cluster bootstrap and applications
            - Host data-store tasks
            - Observability add-ons
