apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-smoke
  namespace: longhorn-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: longhorn-smoke
  template:
    metadata:
      labels:
        app: longhorn-smoke
    spec:
      containers:
        - name: shell
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do date >> /data/probe.log; sleep 30; done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-smoke

